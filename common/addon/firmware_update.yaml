substitutions:
  firmware_version: "dev"

esphome:
  project:
    name: jtenniswood.media-player
    version: "${firmware_version}"
  on_boot:
    - priority: 200
      then:
        - text_sensor.template.publish:
            id: firmware_version_sensor
            state: "${firmware_version}"

text_sensor:
  - platform: template
    name: "Firmware: Version"
    id: firmware_version_sensor
    entity_category: diagnostic
    icon: "mdi:tag"
    update_interval: never
    lambda: 'return {"${firmware_version}"};'

# NOTE (fork): the http_request `update` entity that pulled prebuilt firmware from
# upstream GitHub Pages has been removed — installing it would overwrite this
# fork's weather build. This device is flashed from the ESPHome dashboard via the
# remote package instead. The two controls below are kept so product/settings.json
# and the generated browser UI stay consistent, but nothing acts on them.
switch:
  - platform: template
    name: "Firmware: Auto Update"
    id: auto_update_switch
    entity_category: config
    internal: ${ha_config_internal}
    icon: "mdi:update"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  - platform: template
    name: "Firmware: Update Frequency"
    id: update_frequency_select
    entity_category: config
    internal: ${ha_config_internal}
    icon: "mdi:timer-outline"
    options:
      - "Hourly"
      - "Daily"
      - "Weekly"
    initial_option: "Daily"
    optimistic: true
    restore_value: true
