# =============================================================================
# DISPLAY DIAGNOSTICS (fork, temporary)
# =============================================================================
# The panel config is written by dump_config() during setup, before WiFi and
# the API are up, so it never reaches a remote log viewer. These buttons let
# the device re-emit it on demand, and paint the panel directly so we can tell
# a dead RGB stream apart from a UI that renders nothing.
#
# Remove this package once the black screen is resolved.
# =============================================================================

button:
  # Re-emits the full panel configuration (pins, timings, pixel mode) to any
  # connected log viewer. This is the boot-time dump, replayed on demand.
  - platform: template
    name: "Diag: Dump Display Config"
    id: diag_dump_display
    entity_category: diagnostic
    icon: "mdi:file-document-outline"
    on_press:
      - lambda: |-
          ESP_LOGI("diag", "---- display dump_config() follows ----");
          // MipiRgbSpi redeclares dump_config() as protected, so call it
          // through Component, where it is public. Virtual dispatch still
          // lands on the panel's own override.
          static_cast<esphome::Component *>(id(my_display))->dump_config();

  # Paints the whole panel white, bypassing LVGL entirely.
  #  - screen turns white  -> panel and RGB scan-out are fine, the fault is in
  #                           the LVGL/artwork layer above it
  #  - screen stays black  -> the RGB stream itself is not reaching the panel
  - platform: template
    name: "Diag: White Screen"
    id: diag_white_screen
    entity_category: diagnostic
    icon: "mdi:square"
    on_press:
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 0s
      - lvgl.pause:
      - lambda: |-
          id(my_display)->fill(Color(255, 255, 255));
          id(my_display)->update();
          ESP_LOGI("diag", "filled panel white, LVGL paused");

  # Same, in red — a white result can also come from a stuck backlight on some
  # panels, red cannot.
  - platform: template
    name: "Diag: Red Screen"
    id: diag_red_screen
    entity_category: diagnostic
    icon: "mdi:square"
    on_press:
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 0s
      - lvgl.pause:
      - lambda: |-
          id(my_display)->fill(Color(255, 0, 0));
          id(my_display)->update();
          ESP_LOGI("diag", "filled panel red, LVGL paused");

  # Hands the panel back to the dashboard.
  - platform: template
    name: "Diag: Resume UI"
    id: diag_resume_ui
    entity_category: diagnostic
    icon: "mdi:play"
    on_press:
      - lvgl.resume:
      - lvgl.widget.redraw:
      - lambda: 'ESP_LOGI("diag", "LVGL resumed");'

  # Full UI state dump: which overlay is covering the screen, what the clock
  # label holds, and how much memory LVGL has left to draw into.
  - platform: template
    name: "Diag: Dump UI State"
    id: diag_dump_ui
    entity_category: diagnostic
    icon: "mdi:information-outline"
    on_press:
      - lambda: |-
          ESP_LOGI("diag", "flags: lvgl_ready=%d setup=%d clock=%d dimmed=%d ui_hidden=%d panel=%d tv=%d web=%d",
                   (int) id(lvgl_ready), (int) id(device_has_been_setup),
                   (int) id(is_clock_showing), (int) id(is_screen_dimmed),
                   (int) id(is_ui_hidden), (int) id(is_panel_open),
                   (int) id(is_tv_mode), (int) id(web_settings_active));
          ESP_LOGI("diag", "hidden: clock=%d loading=%d setup_prompt=%d ha_prompt=%d wifi_prompt=%d actions=%d websettings=%d",
                   (int) lv_obj_has_flag(id(clock_screensaver), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(loading_screen), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(setup_prompt), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(ha_setup_prompt), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(wifi_setup_prompt), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(actions_prompt), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(web_settings_screen), LV_OBJ_FLAG_HIDDEN));
          ESP_LOGI("diag", "hidden: artwork_panel=%d artwork_widget=%d track_info=%d settings_panel=%d",
                   (int) lv_obj_has_flag(id(artwork_bg_panel), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(album_art_background_widget), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(track_info_text), LV_OBJ_FLAG_HIDDEN),
                   (int) lv_obj_has_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN));
          ESP_LOGI("diag", "clock_label pos=%d,%d size=%dx%d hidden=%d",
                   (int) lv_obj_get_x(id(clock_label)), (int) lv_obj_get_y(id(clock_label)),
                   (int) lv_obj_get_width(id(clock_label)), (int) lv_obj_get_height(id(clock_label)),
                   (int) lv_obj_has_flag(id(clock_label), LV_OBJ_FLAG_HIDDEN));

  # Ask the dashboard to render the normal track view.
  - platform: template
    name: "Diag: Force Track View"
    id: diag_force_track
    entity_category: diagnostic
    icon: "mdi:television-play"
    on_press:
      - lvgl.resume:
      - script.execute: show_track_view
      - lvgl.widget.redraw:

# Memory pressure, via ESPHome's own debug platform rather than raw heap_caps
# calls, which are not guaranteed to be included in the generated main.cpp.
debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Diag: Heap Free"
      entity_category: diagnostic
    block:
      name: "Diag: Largest Free Block"
      entity_category: diagnostic
    psram:
      name: "Diag: PSRAM Free"
      entity_category: diagnostic
